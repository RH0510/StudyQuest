# Render.com Blueprint: deploys StudyQuest as a free Node.js web service.
# MONGODB_URI is entered in the Render dashboard; JWT_SECRET is generated by Render.
services:
  - type: web
    name: studyquest
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DB_NAME
        value: studyquest
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FOCUS_MINUTES
        value: "25"
      - key: BREAK_MINUTES
        value: "5"
      - key: LOGIN_RATE_LIMIT
        value: "5"
